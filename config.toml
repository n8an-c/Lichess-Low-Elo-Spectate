# Low-ELO Lichess Spectator configuration.
# Paths are relative to the directory you run the CLI from.

[lichess]
user_agent = "lichess-low-elo-spectate (local, personal use)"
# Minimum spacing between consecutive requests to Lichess (one request at a
# time, politely). 1.0 is safe; 0.5 is faster but revert if a 429 shows up,
# because a single 429 pauses everything for rate_limit_pause_seconds.
courtesy_delay_seconds = 1.0
# Seconds to pause ALL requests after receiving an HTTP 429.
rate_limit_pause_seconds = 60
# Optional personal API token (https://lichess.org/account/oauth/token).
# Raises the games-export throttle from 20 to 30 games/s; otherwise unused.
token = ""

[pool]
# Where pool members come from:
#   "games" = snowball from rated games: start from a few players, keep the
#             opponents rated under the cap in games with the configured time
#             controls, repeat. Every member is a proven player of those time
#             controls, and a 2,000-member pool takes minutes, not an hour.
#   "teams" = scan team rosters (slow: ~50 s per team, and most members with a
#             low blitz rating never play the configured time controls).
#   "both"  = teams first, then the crawl tops the pool up.
source = "games"
# Keep players whose blitz rating is strictly below this.
rating_cap = 1000
# Profile check: members must have been seen on Lichess within this many days.
active_days = 7
# How often the pool is rebuilt / topped up (hours).
pool_refresh_hours = 3
# Profile look-ups (POST /api/users, 300 per call) allowed per refresh.
# Lichess allows 8,000 users per 10 minutes, so 20 batches stays under it.
max_profile_refresh_batches = 20

# -- games source --
# Optional starting points (Lichess usernames). With none given, the crawler
# starts from unexpanded pool members, then from low-rated participants of the
# rating-capped Lichess arenas.
seed_players = []
# Stop crawling once this many members are active; the pool keeps growing a
# little from the "trickle" below and shrinks as inactive members expire.
max_members = 2000
# Games-export requests per crawl (each ~3-4 s for 75 games).
crawl_request_budget = 300
# Only games from the last N days count; members without a game in N days expire.
games_since_days = 14
# Games fetched per player (Lichess rounds values above 25 up to a multiple of 25).
games_per_request = 75
# Expand players at or below this rating first: their opponents are mostly under the cap.
expand_rating_max = 950
# Every few minutes re-read the latest games of the most active (and currently
# online) members to pick up fresh opponents who are likely playing right now.
trickle_interval_minutes = 5
trickle_players = 10
trickle_hours = 2
# Light refresh: re-check stale profiles, look up discovered opponents, expire
# inactive members.
light_refresh_minutes = 15
profile_recheck_hours = 6

# -- teams source (only used when source is "teams" or "both") --
team_ids = ["chess-beginners", "pca-usa-advanced-beginner"]
# Keyword search matches team descriptions too and returns huge variant teams
# whose members never play standard blitz; leave empty unless you know better.
team_keywords = []
keyword_max_pages = 1
# Lichess caps full-profile member streams at the 1,000 newest members (~50 s per team).
max_members_per_team = 1500

[detection]
# How games are found:
#   "poll"   = ask /api/users/status about pooled players (the detector that works)
#   "stream" = /api/stream/games-by-users streams; Lichess only reports games
#              where BOTH players are in the same 300-player list, so with a
#              normal pool this sees almost nothing
#   "both"   = run both; duplicates are removed
mode = "poll"
# Time controls to show, as Lichess writes them. Adding "3+2", "5+0" and
# "5+3" roughly triples the games for the same pool.
time_controls = ["3+0"]
# "both": both players must be under rating_cap (the spec's rule);
# "either": at least one player under the cap (about twice the games).
rating_rule = "both"
# Only show games at most this many plies in when verified. The stream is
# about 3 plies behind the real game, so 20 means roughly <= 23 real plies
# (use 7 for a strict "<= 10 real plies").
max_start_plies = 20
# Players reported online are re-polled every N seconds (one request per 100);
# everyone else is swept cold_batches_per_tick x 100 players per tick.
hot_poll_seconds = 3
cold_batches_per_tick = 2
# Minimum seconds per poll tick (0 = as fast as the request spacing allows).
poll_interval_seconds = 0
# Game streams opened in parallel for verification (Lichess allows 8 per IP).
verify_concurrency = 4
# Reject games created more than this many seconds ago (unless still at ply 0).
max_game_age_seconds = 120
# The game stream replays all moves so far in a quick burst; a gap of this
# many seconds with no line means the replay is over.
replay_idle_seconds = 0.3
# Give up on a game stream that sends nothing for this long.
stream_open_timeout_seconds = 15
# Accepted games stay in the candidate list for this long.
candidate_ttl_seconds = 180
# Reconnect delay after a games-by-users stream drops; doubles up to the max.
stream_backoff_seconds = 5
stream_backoff_max_seconds = 60

[viewer]
engine_depth = 12

[storage]
sqlite_path = "spectate.sqlite3"

[server]
host = "127.0.0.1"
port = 8000
