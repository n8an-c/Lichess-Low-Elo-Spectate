<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Low-ELO Lichess Spectator</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <h1>Low-ELO Spectator</h1>
        <span class="controls">
          <button id="eval-toggle" type="button" title="Shortcut: E">Eval: on</button>
          <button id="next" type="button" title="Shortcut: N">Next game</button>
        </span>
      </header>
      <section class="game">
        <div class="player" id="black">
          <span class="who"><span class="name">—</span> <span class="rating"></span></span>
          <span class="clock" id="clock-black">–:––</span>
        </div>
        <div class="board-row">
          <div id="eval-bar" class="eval-bar" title="Stockfish evaluation (white's perspective)">
            <div class="eval-white"></div>
            <span class="eval-label" id="eval-label"></span>
            <span class="eval-depth" id="eval-depth"></span>
          </div>
          <div id="board" class="cg-wrap"></div>
        </div>
        <div class="player" id="white">
          <span class="who"><span class="name">—</span> <span class="rating"></span></span>
          <span class="clock" id="clock-white">–:––</span>
        </div>
      </section>
      <p id="result" class="result" hidden></p>
      <p id="status" class="status">Connecting…</p>
      <p id="link" class="link"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
